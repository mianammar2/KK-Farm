# D-090: KK Farms for iPhone. Generate the Xcode project with XcodeGen:  brew install xcodegen && cd ios && xcodegen
name: KKFarms
options:
  bundleIdPrefix: com.kkfarm
  deploymentTarget:
    iOS: "16.0"
targets:
  KKFarms:
    type: application
    platform: iOS
    sources: [KKFarms]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kkfarm.ios
        MARKETING_VERSION: "0.6.3"
        CURRENT_PROJECT_VERSION: "15"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KK Farms
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: KK Farms uses the camera to take goat photos.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: KK Farms lets you pick goat photos from your library.
        # DEVELOPMENT_TEAM: set to your Apple team in Xcode (Signing & Capabilities) before running on the iPhone.
